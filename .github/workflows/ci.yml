name: Synthetic checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install before test isolation
        run: |
          python -m venv /tmp/reach-ci-venv
          /tmp/reach-ci-venv/bin/python -m pip install .
      - name: Run synthetic tests without network or home writes
        run: |
          fixture=$(mktemp -d /tmp/reach-ci.XXXXXX)
          ditto . "$fixture/repo"
          mkdir -p "$fixture/mailbox" "$fixture/sessions" "$fixture/projects" "$fixture/workspaces/ALTAIR" "$fixture/workspaces/POLARIS" "$fixture/empty"
          sandbox=(/usr/bin/sandbox-exec -f "$fixture/repo/.github/ci/sandbox.sb" -D USER_HOME="$HOME" -D CONFIG="$HOME/.config" -D LIBRARY="$HOME/Library" -D SSH="$HOME/.ssh" -D CLAUDE="$HOME/.claude" -D CODEX="$HOME/.codex")
          clean=(env -i PATH=/tmp/reach-ci-venv/bin:/usr/bin:/bin TMPDIR=/private/tmp PYTHONDONTWRITEBYTECODE=1 REACH_MAILBOX_DIR="$fixture/mailbox" REACH_SESSIONS_DIR="$fixture/sessions" REACH_PROJECTS_DIR="$fixture/projects" REACH_DESKTOP_DIR="$fixture/workspaces")
          cd "$fixture/repo"
          "${sandbox[@]}" "${clean[@]}" /tmp/reach-ci-venv/bin/python -m unittest test_reach test_concurrency test_portability -v
          cd "$fixture/empty"
          "${sandbox[@]}" "${clean[@]}" /tmp/reach-ci-venv/bin/reach --help
          "${sandbox[@]}" "${clean[@]}" /tmp/reach-ci-venv/bin/python "$fixture/repo/examples/synthetic_demo.py"
